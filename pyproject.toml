[project]
name = "lionel"
version = "0.3.0"
description = "Predict fantasy player points and optimise the team"
authors = [{ name = "jotohow", email = "jtobyh@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pymc>=5.0,<6",
    "pymc-marketing>=0.9.0",
    "arviz==0.19.0",
    "seaborn",
    "pulp",
    "requests",
    "pydantic>=2",
]

[project.urls]
Homepage = "https://github.com/jth500/lionel"
Repository = "https://github.com/jth500/lionel"

[dependency-groups]
dev = [
    "black>=24.10.0",
    "flake8>=7",
    "ipykernel>=7.4.0",
    "pandas>=3.0.6",
    "pytest>=8",
]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ["py311"]
